    <g transform="translate(70, 0)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" text-anchor="middle">Kafka</text>
    </g>
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" text-anchor="middle">Spark</text>
    </g>
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle">Snowflake</text>
    </g>
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="50" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="25" y="15" text-anchor="middle">dbt</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" text-anchor="middle">Azure</text>
    </g>
    <g transform="translate(430, 0)">
      <rect x="0" y="0" width="90" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
