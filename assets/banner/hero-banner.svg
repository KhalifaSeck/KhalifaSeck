<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Khalifa Ababacar Seck - Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- Decorative pipeline nodes right side -->
  <g opacity="0.55" transform="translate(880, 40)">
    <circle cx="0" cy="0" r="6" fill="#00d9ff"/>
    <circle cx="80" cy="40" r="6" fill="#22d3ee"/>
    <circle cx="160" cy="20" r="6" fill="#a855f7"/>
    <circle cx="240" cy="80" r="6" fill="#14b8a6"/>
    <circle cx="60" cy="140" r="6" fill="#a855f7"/>
    <circle cx="180" cy="180" r="6" fill="#00d9ff"/>
    <circle cx="280" cy="140" r="6" fill="#22d3ee"/>
    <circle cx="120" cy="220" r="6" fill="#14b8a6"/>
    <circle cx="220" cy="230" r="6" fill="#a855f7"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="40" x2="160" y2="20" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    <line x1="160" y1="20" x2="240" y2="80" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="40" x2="60" y2="140" stroke="#14b8a6" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="140" x2="180" y2="180" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <line x1="240" y1="80" x2="280" y2="140" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <line x1="180" y1="180" x2="280" y2="140" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
    <line x1="180" y1="180" x2="120" y2="220" stroke="#14b8a6" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="220" x2="220" y2="230" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Small top label — portfolio marker -->
  <g transform="translate(60, 65)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="4">PORTFOLIO</text>
    <rect x="0" y="8" width="40" height="2" fill="#00d9ff"/>
  </g>

  <!-- Name -->
  <text x="60" y="140" font-family="'Inter', 'Segoe UI', sans-serif" font-size="60" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">KHALIFA ABABACAR SECK</text>

  <!-- Divider line -->
  <rect x="60" y="165" width="220" height="2" fill="url(#accent)"/>

  <!-- Subtitle roles -->
  <text x="60" y="205" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">Data Engineer  <tspan fill="#475569">·</tspan>  Analytics Engineer  <tspan fill="#475569">·</tspan>  Data Analyst</text>

  <!-- Meta line -->
  <g transform="translate(60, 245)" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
    <text x="0" y="0">
      <tspan fill="#00d9ff">◆</tspan>
      <tspan dx="8">Quebec, CANADA</tspan>
      <tspan dx="16" fill="#475569">|</tspan>
      <tspan dx="16" fill="#a855f7">◆</tspan>
      <tspan dx="8">Master's in Computer Science</tspan>
      <tspan dx="16" fill="#475569">|</tspan>
      <tspan dx="16" fill="#14b8a6">◆</tspan>
      <tspan dx="8">French  ·  English  ·  Wolof</tspan>
    </text>
  </g>
</svg>
