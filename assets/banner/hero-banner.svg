      <tspan dx="16" fill="#475569">|</tspan>
      <tspan dx="16" fill="#a855f7">◆</tspan>
      <tspan dx="8">Master's Computer Science</tspan>
      <tspan dx="16" fill="#475569">|</tspan>
      <tspan dx="16" fill="#14b8a6">◆</tspan>
      <tspan dx="8">Université de Sherbrooke</tspan>
    </text>
  </g>

