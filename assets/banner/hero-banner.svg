  <!-- Subtitle roles -->
  <text x="60" y="235" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">Data Engineer  <tspan fill="#475569">·</tspan>  Analytics Engineer  <tspan fill="#475569">·</tspan>  Data Analyst</text>

