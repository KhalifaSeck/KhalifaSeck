<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <defs>
    <linearGradient id="dl1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0f2937"/>
    </linearGradient>
    <linearGradient id="dlTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="14" fill="url(#dl1)"/>

  <g transform="translate(500, 30)">
    <circle cx="30" cy="30" r="28" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="30" y="40" text-anchor="middle" font-size="28">🚚</text>
  </g>

  <text x="24" y="60" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#dlTitle)">Real-Time Delivery</text>
  <text x="24" y="88" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#dlTitle)">Lakehouse</text>

  <text x="24" y="124" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Real-time delivery analytics with Kafka streaming,</text>
  <text x="24" y="142" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Spark Structured Streaming and Delta Lake.</text>
  <text x="24" y="160" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Live KPIs, driver &amp; vehicle tracking.</text>

  <!-- Mini map/route visualization -->
  <g transform="translate(24, 190)" opacity="0.9">
    <rect x="0" y="0" width="552" height="80" rx="8" fill="#0f1729" stroke="#334155" stroke-width="1"/>
    <path d="M 20 60 Q 100 20, 180 40 T 340 30 T 500 50" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="20" cy="60" r="5" fill="#00d9ff"/>
    <circle cx="180" cy="40" r="4" fill="#14b8a6"/>
    <circle cx="340" cy="30" r="4" fill="#14b8a6"/>
    <circle cx="500" cy="50" r="6" fill="#a855f7"/>
    <text x="15" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">START</text>
    <text x="480" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a855f7">DELIVERED</text>
  </g>

  <!-- Tech badges -->
  <g transform="translate(24, 290)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
    <g><rect width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Python</text></g>
    <g transform="translate(60,0)"><rect width="42" height="22" rx="3" fill="#1e293b"/><text x="21" y="15" text-anchor="middle">Kafka</text></g>
    <g transform="translate(110,0)"><rect width="42" height="22" rx="3" fill="#1e293b"/><text x="21" y="15" text-anchor="middle">Spark</text></g>
    <g transform="translate(160,0)"><rect width="68" height="22" rx="3" fill="#1e293b"/><text x="34" y="15" text-anchor="middle">Delta Lake</text></g>
    <g transform="translate(236,0)"><rect width="42" height="22" rx="3" fill="#1e293b"/><text x="21" y="15" text-anchor="middle">Azure</text></g>
    <g transform="translate(286,0)"><rect width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Airflow</text></g>
    <g transform="translate(346,0)"><rect width="30" height="22" rx="3" fill="#1e293b"/><text x="15" y="15" text-anchor="middle">dbt</text></g>
    <g transform="translate(384,0)"><rect width="70" height="22" rx="3" fill="#1e293b"/><text x="35" y="15" text-anchor="middle">Streamlit</text></g>
  </g>

  <g transform="translate(24, 328)" font-family="'Inter', sans-serif" font-size="11">
    <text fill="#14b8a6" font-weight="700">Real-time KPIs</text>
    <text x="120" fill="#64748b">·</text>
    <text x="140" fill="#00d9ff" font-weight="700">Delta Lake</text>
    <text x="230" fill="#64748b">·</text>
    <text x="250" fill="#a855f7" font-weight="700">Live tracking</text>
  </g>
</svg>
