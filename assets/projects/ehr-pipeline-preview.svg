<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <defs>
    <linearGradient id="ehr1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0b1e2e"/>
    </linearGradient>
    <linearGradient id="ehrTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="14" fill="url(#ehr1)"/>

  <g transform="translate(500, 30)">
    <circle cx="30" cy="30" r="28" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="30" y="40" text-anchor="middle" font-size="28">🏥</text>
  </g>

  <text x="24" y="60" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#ehrTitle)">EHR Data</text>
  <text x="24" y="88" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#ehrTitle)">Engineering Pipeline</text>

  <text x="24" y="124" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">End-to-end ELT pipeline for healthcare data</text>
  <text x="24" y="142" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">using Airflow, Snowflake and dbt.</text>

  <!-- Flow diagram -->
  <g transform="translate(24, 180)" font-family="'JetBrains Mono', monospace" font-size="10">
    <rect x="0" y="0" width="552" height="70" rx="8" fill="#0f1729" stroke="#334155"/>
    <g transform="translate(20, 20)">
      <rect width="80" height="30" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="40" y="19" text-anchor="middle" fill="#e2e8f0">EHR APIs</text>
      <text x="102" y="19" fill="#64748b" font-size="14">→</text>
      <rect x="120" width="80" height="30" rx="4" fill="#1e293b" stroke="#00d9ff" stroke-opacity="0.5"/>
      <text x="160" y="19" text-anchor="middle" fill="#e2e8f0">Airflow</text>
      <text x="222" y="19" fill="#64748b" font-size="14">→</text>
      <rect x="240" width="80" height="30" rx="4" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="280" y="19" text-anchor="middle" fill="#e2e8f0">Snowflake</text>
      <text x="342" y="19" fill="#64748b" font-size="14">→</text>
      <rect x="360" width="60" height="30" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-opacity="0.5"/>
      <text x="390" y="19" text-anchor="middle" fill="#e2e8f0">dbt</text>
      <text x="422" y="19" fill="#64748b" font-size="14">→</text>
      <rect x="440" width="70" height="30" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="475" y="19" text-anchor="middle" fill="#e2e8f0">Reports</text>
    </g>
  </g>

  <!-- Data quality checkmarks -->
  <g transform="translate(24, 270)" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
    <text fill="#14b8a6">✓</text><text x="14">HIPAA-aware modeling</text>
    <text x="180" fill="#14b8a6">✓</text><text x="194">dbt tests</text>
    <text x="280" fill="#14b8a6">✓</text><text x="294">Incremental loads</text>
    <text x="410" fill="#14b8a6">✓</text><text x="424">Analytical marts</text>
  </g>

  <g transform="translate(24, 296)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
    <g><rect width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Python</text></g>
    <g transform="translate(60,0)"><rect width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Airflow</text></g>
    <g transform="translate(120,0)"><rect width="70" height="22" rx="3" fill="#1e293b"/><text x="35" y="15" text-anchor="middle">Snowflake</text></g>
    <g transform="translate(198,0)"><rect width="30" height="22" rx="3" fill="#1e293b"/><text x="15" y="15" text-anchor="middle">dbt</text></g>
    <g transform="translate(236,0)"><rect width="30" height="22" rx="3" fill="#1e293b"/><text x="15" y="15" text-anchor="middle">SQL</text></g>
    <g transform="translate(274,0)"><rect width="80" height="22" rx="3" fill="#1e293b"/><text x="40" y="15" text-anchor="middle">Healthcare</text></g>
    <g transform="translate(362,0)"><rect width="34" height="22" rx="3" fill="#1e293b"/><text x="17" y="15" text-anchor="middle">ELT</text></g>
  </g>

  <g transform="translate(24, 335)" font-family="'Inter', sans-serif" font-size="11">
    <text fill="#22d3ee" font-weight="700">ELT · Modeling · Reporting</text>
  </g>
</svg>
