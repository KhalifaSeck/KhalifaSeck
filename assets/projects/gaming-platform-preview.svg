<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <defs>
    <linearGradient id="gp1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="gpTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="gpGlow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" rx="14" fill="url(#gp1)"/>
  <rect width="600" height="360" rx="14" fill="url(#gpGlow)"/>

  <!-- Top badge -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="35" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a855f7">FEATURED</text>
  </g>

  <!-- Icon: controller-ish + streaming lines -->
  <g transform="translate(500, 30)" opacity="0.9">
    <circle cx="30" cy="30" r="28" fill="#00d9ff" fill-opacity="0.1" stroke="#00d9ff" stroke-opacity="0.4"/>
    <text x="30" y="40" text-anchor="middle" font-size="28">🎮</text>
  </g>

  <!-- Title -->
  <text x="24" y="100" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#gpTitle)">Real-Time Gaming</text>
  <text x="24" y="128" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#gpTitle)">Intelligence Platform</text>

  <!-- Description -->
  <text x="24" y="164" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Cloud-native end-to-end platform combining real-time</text>
  <text x="24" y="182" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">streaming, batch ingestion, analytics, knowledge graphs</text>
  <text x="24" y="200" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">and AI-powered insights on ~100K video games.</text>

  <!-- Mini pipeline visual -->
  <g transform="translate(24, 220)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">
    <rect x="0" y="0" width="72" height="28" rx="4" fill="#0f1729" stroke="#00d9ff" stroke-opacity="0.5"/>
    <text x="36" y="18" text-anchor="middle">Kafka</text>
    <text x="80" y="18" fill="#64748b" font-size="12">→</text>
    <rect x="94" y="0" width="72" height="28" rx="4" fill="#0f1729" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="130" y="18" text-anchor="middle">Spark</text>
    <text x="174" y="18" fill="#64748b" font-size="12">→</text>
    <rect x="188" y="0" width="88" height="28" rx="4" fill="#0f1729" stroke="#14b8a6" stroke-opacity="0.5"/>
    <text x="232" y="18" text-anchor="middle">Snowflake</text>
    <text x="284" y="18" fill="#64748b" font-size="12">→</text>
    <rect x="298" y="0" width="60" height="28" rx="4" fill="#0f1729" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="328" y="18" text-anchor="middle">dbt</text>
    <text x="366" y="18" fill="#64748b" font-size="12">→</text>
    <rect x="380" y="0" width="72" height="28" rx="4" fill="#0f1729" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="416" y="18" text-anchor="middle">Neo4j</text>
    <text x="460" y="18" fill="#64748b" font-size="12">→</text>
    <rect x="474" y="0" width="76" height="28" rx="4" fill="#0f1729" stroke="#00d9ff" stroke-opacity="0.5"/>
    <text x="512" y="18" text-anchor="middle">FastAPI</text>
  </g>

  <!-- Tech badges bottom row -->
  <g transform="translate(24, 274)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
    <g><rect x="0" y="0" width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Python</text></g>
    <g transform="translate(60,0)"><rect width="42" height="22" rx="3" fill="#1e293b"/><text x="21" y="15" text-anchor="middle">Azure</text></g>
    <g transform="translate(110,0)"><rect width="70" height="22" rx="3" fill="#1e293b"/><text x="35" y="15" text-anchor="middle">Kubernetes</text></g>
    <g transform="translate(188,0)"><rect width="68" height="22" rx="3" fill="#1e293b"/><text x="34" y="15" text-anchor="middle">Terraform</text></g>
    <g transform="translate(264,0)"><rect width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Airflow</text></g>
    <g transform="translate(324,0)"><rect width="58" height="22" rx="3" fill="#1e293b"/><text x="29" y="15" text-anchor="middle">Grafana</text></g>
    <g transform="translate(390,0)"><rect width="70" height="22" rx="3" fill="#1e293b"/><text x="35" y="15" text-anchor="middle">LangGraph</text></g>
  </g>

  <!-- Metrics footer -->
  <g transform="translate(24, 314)" font-family="'Inter', sans-serif" font-size="11">
    <text fill="#00d9ff" font-weight="700">100K+</text>
    <text x="42" fill="#64748b">games</text>
    <text x="90" fill="#a855f7" font-weight="700">8 events/s</text>
    <text x="160" fill="#64748b">streaming</text>
    <text x="230" fill="#14b8a6" font-weight="700">Bronze→Silver→Gold</text>
    <text x="380" fill="#64748b">medallion</text>
    <text x="450" y="0" fill="#22d3ee" font-weight="700">MIT</text>
  </g>
</svg>
