  <text x="24" y="124" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Funnel visualization, conversion tracking</text>
  <text x="24" y="142" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">and performance metrics for marketing pipelines.</text>

  <!-- Funnel shape -->
  <g transform="translate(180, 165)">
    <polygon points="0,0 240,0 200,25 40,25" fill="#a855f7" opacity="0.9"/>
