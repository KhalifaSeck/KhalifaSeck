<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <defs>
    <linearGradient id="mf1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#2a0b2e"/>
    </linearGradient>
    <linearGradient id="mfTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="14" fill="url(#mf1)"/>

  <g transform="translate(500, 30)">
