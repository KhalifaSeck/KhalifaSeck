    <text x="30" y="40" text-anchor="middle" font-size="28">📊</text>
  </g>

  <text x="24" y="60" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#mfTitle)">Marketing Funnel</text>
