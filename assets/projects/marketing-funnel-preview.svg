    <g transform="translate(60,0)"><rect width="50" height="22" rx="3" fill="#1e293b"/><text x="25" y="15" text-anchor="middle">Pandas</text></g>
    <g transform="translate(118,0)"><rect width="42" height="22" rx="3" fill="#1e293b"/><text x="21" y="15" text-anchor="middle">Plotly</text></g>
    <g transform="translate(168,0)"><rect width="70" height="22" rx="3" fill="#1e293b"/><text x="35" y="15" text-anchor="middle">Streamlit</text></g>
    <g transform="translate(246,0)"><rect width="30" height="22" rx="3" fill="#1e293b"/><text x="15" y="15" text-anchor="middle">SQL</text></g>
    <g transform="translate(284,0)"><rect width="50" height="22" rx="3" fill="#1e293b"/><text x="25" y="15" text-anchor="middle">Jupyter</text></g>
    <g transform="translate(342,0)"><rect width="90" height="22" rx="3" fill="#1e293b"/><text x="45" y="15" text-anchor="middle">Scikit-learn</text></g>
