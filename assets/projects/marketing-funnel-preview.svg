    <text x="120" y="76" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#0a0e27" font-weight="700">DECISION</text>
    <text x="120" y="103" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#0a0e27" font-weight="700">BUY</text>
