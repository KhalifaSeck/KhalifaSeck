<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <defs>
    <linearGradient id="oq1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#0b2e29"/>
    </linearGradient>
    <linearGradient id="oqTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="14" fill="url(#oq1)"/>

  <g transform="translate(500, 30)">
    <circle cx="30" cy="30" r="28" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-opacity="0.4"/>
    <text x="30" y="40" text-anchor="middle" font-size="28">✅</text>
  </g>

  <text x="24" y="60" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#oqTitle)">Olist Data Quality</text>
  <text x="24" y="88" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="url(#oqTitle)">Framework</text>

  <text x="24" y="124" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Data quality assessment framework: profiling,</text>
  <text x="24" y="142" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">validation rules, quality scoring, automated reports.</text>

  <!-- Score circle -->
  <g transform="translate(50, 180)">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#334155" stroke-width="8"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#14b8a6" stroke-width="8" stroke-dasharray="290 314" stroke-linecap="round" transform="rotate(-90 60 60)"/>
    <text x="60" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#14b8a6">92</text>
    <text x="60" y="76" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">QUALITY %</text>
  </g>

  <!-- Metric bars -->
  <g transform="translate(200, 175)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0">
    <text x="0" y="12">Completeness</text>
    <rect x="120" y="4" width="200" height="10" rx="2" fill="#1e293b"/>
    <rect x="120" y="4" width="190" height="10" rx="2" fill="#14b8a6"/>
    <text x="330" y="12" fill="#14b8a6">95%</text>

    <text x="0" y="34">Uniqueness</text>
    <rect x="120" y="26" width="200" height="10" rx="2" fill="#1e293b"/>
    <rect x="120" y="26" width="180" height="10" rx="2" fill="#00d9ff"/>
    <text x="330" y="34" fill="#00d9ff">90%</text>

    <text x="0" y="56">Validity</text>
    <rect x="120" y="48" width="200" height="10" rx="2" fill="#1e293b"/>
    <rect x="120" y="48" width="196" height="10" rx="2" fill="#a855f7"/>
    <text x="330" y="56" fill="#a855f7">98%</text>

    <text x="0" y="78">Consistency</text>
    <rect x="120" y="70" width="200" height="10" rx="2" fill="#1e293b"/>
    <rect x="120" y="70" width="170" height="10" rx="2" fill="#22d3ee"/>
    <text x="330" y="78" fill="#22d3ee">85%</text>
  </g>

  <g transform="translate(24, 290)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">
    <g><rect width="52" height="22" rx="3" fill="#1e293b"/><text x="26" y="15" text-anchor="middle">Python</text></g>
    <g transform="translate(60,0)"><rect width="118" height="22" rx="3" fill="#1e293b"/><text x="59" y="15" text-anchor="middle">Great Expectations</text></g>
    <g transform="translate(186,0)"><rect width="50" height="22" rx="3" fill="#1e293b"/><text x="25" y="15" text-anchor="middle">Pandas</text></g>
    <g transform="translate(244,0)"><rect width="60" height="22" rx="3" fill="#1e293b"/><text x="30" y="15" text-anchor="middle">Profiling</text></g>
    <g transform="translate(312,0)"><rect width="50" height="22" rx="3" fill="#1e293b"/><text x="25" y="15" text-anchor="middle">Jupyter</text></g>
  </g>

  <g transform="translate(24, 328)" font-family="'Inter', sans-serif" font-size="11">
    <text fill="#14b8a6" font-weight="700">Profiling</text>
    <text x="80" fill="#64748b">·</text>
    <text x="95" fill="#00d9ff" font-weight="700">Validation rules</text>
    <text x="200" fill="#64748b">·</text>
    <text x="215" fill="#a855f7" font-weight="700">Automated reports</text>
  </g>
</svg>
