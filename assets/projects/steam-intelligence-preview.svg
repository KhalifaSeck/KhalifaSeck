      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#171e3a"/>
    </linearGradient>
    <linearGradient id="siTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
