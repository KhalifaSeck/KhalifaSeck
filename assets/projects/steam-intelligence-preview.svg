  <text x="24" y="124" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Steam analytics platform: ingestion, processing,</text>
  <text x="24" y="142" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">warehousing, dashboards and insights on games,</text>
  <text x="24" y="160" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">reviews, players and tags.</text>

